<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Web Apps-4-HW</title>
	<style>
		body{border:1px solid gray;}
	</style>
</head>
<body>
<h1>My Favorites</h1>
<h2>My Favorite Colors</h2>

<ol id="colorsList">
	
</ol>

<h2>My Favorite Foods</h2>

<ol id="foodsList">
	
</ol>

<h2>My Favorite Links</h2>

<ol id="linksList">
	
</ol>

<script>
"use strict";
let colors = ["red","green","blue","purple","pink"];
let foods = ["mango", "pozole", "tacos arabes", "carne asada"];

for(let i = 0; i < colors.length; i++){
    let element = document.createElement("li");
    element.innerHTML = colors[i];
    document.querySelector("#colorsList").appendChild(element);
}

for(let food in foods){
    let element = document.createElement("li");
    element.innerHTML = food;
    document.querySelector("#foodsList").appendChild(element);
}

// Optional - can you figure out how to pull both the key AND the value
// from the `links` object literal?
let links = {
		"RIT": "http://www.rit.edu",
		"RWAG" : "https://www.facebook.com/RWAGclub",
		"New Media Club" : "http://newmediaclub.cias.rit.edu"
	}

for(let key in links){
    let element = document.createElement("li");
    element.innerHTML = `<a href=\"${links[key]}\">${key}</a>`;
    document.querySelector("#linksList").appendChild(element);
}

</script>
</body>
</html>
